name: Build Static zsign

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git libssl-dev zlib1g-dev

      - name: Compile Static zsign Binary
        run: |
          git clone https://github.com/zhlynn/zsign.git /tmp/zsign-src
          cd /tmp/zsign-src/build/linux
          make
          mkdir -p ${{ github.workspace }}/bin
          cp /tmp/zsign-src/bin/zsign ${{ github.workspace }}/bin/zsign
          chmod +x ${{ github.workspace }}/bin/zsign

      - name: Commit Binary to Repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add bin/zsign
          git diff --staged --quiet || git commit -m "Add compiled Linux zsign binary"
          git push
